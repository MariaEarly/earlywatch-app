<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Early Watch — Mon compte</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"></div>

  <script src="app.js"></script>
  <script>
    if (!requireAuth()) throw new Error('redirect');

    function render() {
      const user = getUser() || {};
      document.getElementById('app').innerHTML = renderHeader() + `
        <div class="content-main" style="max-width:640px;margin:32px auto;padding:0 24px">
          <h1 style="margin:0 0 24px 0">Mon compte</h1>

          <div class="card" style="padding:24px;margin-bottom:24px">
            <h2 style="margin:0 0 16px 0;font-size:16px">Profil</h2>
            <div class="flex flex-col gap-12">
              <div>
                <label class="text-sm text-tertiary">Nom</label>
                <div>${escHtml((user.first_name || '') + ' ' + (user.last_name || '')).trim() || '—'}</div>
              </div>
              <div>
                <label class="text-sm text-tertiary">Email</label>
                <div>${escHtml(user.email || '—')}</div>
              </div>
              <div>
                <label class="text-sm text-tertiary">Rôle</label>
                <div>${escHtml(user.role || '—')}</div>
              </div>
            </div>
          </div>

          <div class="card" style="padding:24px;margin-bottom:24px">
            <h2 style="margin:0 0 16px 0;font-size:16px">Changer le mot de passe</h2>

            <div id="pwd-error" class="login-error" style="display:none;margin-bottom:12px"></div>
            <div id="pwd-success" style="display:none;margin-bottom:12px;padding:12px;background:#e8f5e9;color:#2e7d32;border-radius:6px;font-size:14px"></div>

            <form id="pwdForm" autocomplete="off">
              <div class="login-field">
                <label for="current_password">Mot de passe actuel</label>
                <input id="current_password" type="password" class="input" required autocomplete="current-password">
              </div>
              <div class="login-field">
                <label for="new_password">Nouveau mot de passe</label>
                <input id="new_password" type="password" class="input" required minlength="8" autocomplete="new-password">
                <p class="text-xs text-tertiary" style="margin:4px 0 0 0">Minimum 8 caractères</p>
              </div>
              <div class="login-field">
                <label for="confirm_password">Confirmer le nouveau mot de passe</label>
                <input id="confirm_password" type="password" class="input" required minlength="8" autocomplete="new-password">
              </div>
              <button type="submit" id="pwdBtn" class="btn btn-primary" style="margin-top:8px">Mettre à jour le mot de passe</button>
            </form>
          </div>

          <div class="card" style="padding:24px">
            <h2 style="margin:0 0 16px 0;font-size:16px">Session</h2>
            <button class="btn btn-secondary" onclick="if(confirm('Se déconnecter ?')) logout()">Se déconnecter</button>
          </div>
        </div>`;

      document.getElementById('pwdForm').addEventListener('submit', onChangePassword);
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    async function onChangePassword(e) {
      e.preventDefault();
      const btn = document.getElementById('pwdBtn');
      const errEl = document.getElementById('pwd-error');
      const okEl = document.getElementById('pwd-success');
      errEl.style.display = 'none';
      okEl.style.display = 'none';

      const current = document.getElementById('current_password').value;
      const next = document.getElementById('new_password').value;
      const confirm = document.getElementById('confirm_password').value;

      if (next !== confirm) {
        errEl.textContent = 'La confirmation ne correspond pas au nouveau mot de passe.';
        errEl.style.display = 'block';
        return;
      }
      if (next.length < 8) {
        errEl.textContent = 'Le nouveau mot de passe doit contenir au moins 8 caractères.';
        errEl.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Mise à jour...';

      try {
        await api('/api/v1/auth/change-password', {
          method: 'POST',
          body: { current_password: current, new_password: next },
        });
        okEl.textContent = 'Mot de passe mis à jour avec succès.';
        okEl.style.display = 'block';
        document.getElementById('pwdForm').reset();
      } catch (err) {
        errEl.textContent = err.message || 'Erreur lors de la mise à jour';
        errEl.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Mettre à jour le mot de passe';
      }
    }

    render();
  </script>
</body>
</html>
