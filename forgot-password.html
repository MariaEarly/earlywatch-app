<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Early Watch — Mot de passe oubli&#233;</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --beige: #F5F0E8; --kaki: #6B7A5E;
  --ink: #1A1A17; --muted: #6B6860; --border: rgba(28,28,26,0.12);
  --red: #DC2626; --green: #4A5240;
}
html, body { height: 100%; }
body {
  font-family: 'IBM Plex Sans', sans-serif;
  background: var(--beige); color: var(--ink);
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; padding: 24px;
}
.card { width: 100%; max-width: 340px; }
.brand {
  font-size: 16px; font-weight: 500; color: var(--ink);
  margin-bottom: 12px; text-align: center;
}
.brand span { color: var(--kaki); }
.subtitle {
  font-size: 13px; color: var(--muted); text-align: center;
  margin-bottom: 32px; line-height: 1.6;
}
label {
  display: block; font-size: 13px; font-weight: 400;
  color: var(--muted); margin-bottom: 6px;
}
input {
  width: 100%; padding: 11px 0;
  border: none; border-bottom: 1px solid var(--border);
  background: transparent;
  font-size: 15px; font-family: inherit; color: var(--ink);
  outline: none; margin-bottom: 24px; transition: border-color .15s;
  border-radius: 0;
}
input:focus { border-color: var(--kaki); }
button {
  width: 100%; padding: 13px;
  background: var(--kaki); color: #fff;
  border: none; border-radius: 6px;
  font-size: 14px; font-weight: 500;
  font-family: inherit; cursor: pointer;
  transition: opacity .15s; margin-top: 8px;
}
button:hover { opacity: .85; }
button:disabled { opacity: .5; cursor: not-allowed; }
.msg {
  font-size: 13px; text-align: center; margin-top: 16px;
  line-height: 1.6; display: none;
}
.msg.success { display: block; color: var(--green); }
.msg.error { display: block; color: var(--red); }
.footer {
  margin-top: 24px; text-align: center;
  font-size: 12px; color: var(--muted);
}
.footer a { color: var(--kaki); text-decoration: none; }
.spinner {
  display: inline-block; width: 14px; height: 14px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: white; border-radius: 50%;
  animation: spin .8s linear infinite; margin-right: 6px; vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
  <div class="brand">Early<span>Watch</span></div>
  <p class="subtitle">Entrez votre email pour recevoir un lien de r&#233;initialisation.</p>
  <form id="reset-form" onsubmit="requestReset(event)">
    <label for="email">Email</label>
    <input type="email" id="email" autocomplete="email" required>
    <button type="submit" id="btn">Envoyer le lien</button>
  </form>
  <div class="msg" id="msg"></div>
  <div class="footer"><a href="login.html">&larr; Retour &#224; la connexion</a></div>
</div>

<script>
const API = (() => {
  const h = window.location.hostname;
  if (h === 'localhost' || h === '127.0.0.1' || h === '') return 'http://127.0.0.1:8000';
  return 'https://earlybriefp7hwqsga-earlybrief-api.functions.fnc.fr-par.scw.cloud';
})();

async function requestReset(e) {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');
  const email = document.getElementById('email').value.trim();

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Envoi\u2026';
  msg.className = 'msg';

  try {
    const r = await fetch(`${API}/api/v1/auth/forgot-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });

    // Always show success (don't reveal if email exists)
    msg.textContent = 'Si ce compte existe, un email de r\u00e9initialisation a \u00e9t\u00e9 envoy\u00e9. V\u00e9rifiez votre bo\u00eete de r\u00e9ception.';
    msg.className = 'msg success';
    document.getElementById('reset-form').style.display = 'none';

  } catch (ex) {
    msg.textContent = 'Erreur de connexion au serveur.';
    msg.className = 'msg error';
    btn.disabled = false;
    btn.textContent = 'Envoyer le lien';
  }
}
</script>
</body>
</html>
