<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Early Watch — Connexion</title>
<link rel="stylesheet" href="style.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
  body::before { display: none; }
  .card { width: 100%; max-width: 340px; }
  .brand { font-size: 16px; font-weight: 500; margin-bottom: 36px; text-align: center; }
  .brand span { color: var(--kaki); }
  label { font-size: 13px; font-weight: 400; color: var(--color-text-secondary); margin-bottom: 6px; }
  input {
    width: 100%; padding: 11px 0;
    border: none; border-bottom: 1px solid var(--color-border-primary);
    background: transparent; font-size: 15px; font-family: inherit;
    color: var(--noir); outline: none; margin-bottom: 24px;
    transition: border-color .15s; border-radius: 0;
  }
  input:focus { border-color: var(--kaki); }
  input.error { border-color: var(--color-danger); margin-bottom: 6px; }
  .error-msg { font-size: 12px; color: var(--color-danger); margin-bottom: 16px; display: none; }
  .error-msg.show { display: block; }
  button {
    width: 100%; padding: 13px; background: var(--kaki); color: #fff;
    border: none; border-radius: 6px; font-size: 14px; font-weight: 500;
    font-family: inherit; cursor: pointer; transition: opacity .15s; margin-top: 8px;
  }
  button:hover { opacity: .85; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .footer { margin-top: 24px; text-align: center; font-size: 12px; color: var(--color-text-secondary); }
  .footer a { color: var(--kaki); text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">Early<span>Watch</span></div>
  <form onsubmit="login(event)">
    <label for="email">Email</label>
    <input type="email" id="email" autocomplete="email" required>
    <label for="password">Mot de passe</label>
    <input type="password" id="password" autocomplete="current-password" required>
    <div class="error-msg" id="err">Email ou mot de passe incorrect.</div>
    <button type="submit" id="btn">Se connecter</button>
  </form>
  <div class="footer">
    <a href="forgot-password.html">Mot de passe oubli&#233; ?</a>
    &nbsp;&middot;&nbsp;
    <a href="mailto:maria@early.consulting">Besoin d'acc&#232;s ?</a>
  </div>
</div>

<script>
const API = (() => {
  const h = window.location.hostname;
  if (h === 'localhost' || h === '127.0.0.1' || h === '') return 'http://127.0.0.1:8000';
  return 'https://earlybriefp7hwqsga-earlybrief-api.functions.fnc.fr-par.scw.cloud';
})();

const t = sessionStorage.getItem('ew_token');
if (t) fetch(`${API}/api/v1/auth/me`, { headers: { 'Authorization': `Bearer ${t}` } })
  .then(r => { if (r.ok) return r.json(); throw 0; })
  .then(u => { window.location.href = u.role === 'superadmin' ? 'superadmin.html' : 'conformite.html'; })
  .catch(() => {});

async function login(e) {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');
  const email = document.getElementById('email');
  const pwd = document.getElementById('password');

  email.classList.remove('error');
  pwd.classList.remove('error');
  err.classList.remove('show');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Connexion\u2026';

  try {
    const r = await fetch(`${API}/api/v1/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email.value.trim(), password: pwd.value }),
    });

    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      throw new Error(d.detail || 'Identifiants incorrects');
    }

    const d = await r.json();
    sessionStorage.setItem('ew_token', d.access_token);
    sessionStorage.setItem('ew_user', JSON.stringify(d.user));
    window.location.href = d.user?.role === 'superadmin' ? 'superadmin.html' : 'conformite.html';

  } catch (ex) {
    email.classList.add('error');
    pwd.classList.add('error');
    err.textContent = ex.message || 'Erreur de connexion';
    err.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Se connecter';
  }
}
</script>
</body>
</html>
