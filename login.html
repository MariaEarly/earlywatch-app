<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Early Watch — Connexion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-logo">Early <span>Watch</span></div>

      <div id="error" class="login-error"></div>

      <form id="loginForm" autocomplete="on">
        <div class="login-field">
          <label for="email">Email</label>
          <input id="email" type="email" class="input" placeholder="vous@entreprise.com" required autofocus>
        </div>
        <div class="login-field">
          <label for="password">Mot de passe</label>
          <input id="password" type="password" class="input" placeholder="Votre mot de passe" required>
        </div>
        <button type="submit" id="submitBtn" class="btn btn-primary login-btn">Connexion</button>
      </form>

      <p style="text-align:center; margin-top:24px; font-size:12px; color:var(--color-text-tertiary)">
        Plateforme de veille réglementaire
      </p>
    </div>
  </div>

  <script>
    // Detection dev local vs prod (meme regle que app.js)
    const API = (() => {
      const h = window.location.hostname;
      if (h === 'localhost' || h === '127.0.0.1' || h === '') {
        return 'http://127.0.0.1:8000';
      }
      return 'https://earlybriefp7hwqsga-earlybrief-api.functions.fnc.fr-par.scw.cloud';
    })();

    // Already logged in?
    if (sessionStorage.getItem('ew_token')) {
      window.location.href = 'dashboard.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const errEl = document.getElementById('error');
      errEl.style.display = 'none';

      btn.disabled = true;
      btn.textContent = 'Connexion...';

      try {
        const res = await fetch(`${API}/api/v1/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });

        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.detail || 'Identifiants incorrects');
        }

        const data = await res.json();
        sessionStorage.setItem('ew_token', data.access_token);
        sessionStorage.setItem('ew_user', JSON.stringify(data.user));
        window.location.href = 'dashboard.html';
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Connexion';
      }
    });
  </script>
</body>
</html>
