<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Early Watch — Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"></div>

  <script src="app.js"></script>
  <script>
    if (!requireAuth()) throw new Error('redirect');

    // ---- State ----
    let articles = [];
    let sources = [];
    let activeFilter = 'all';
    let scoreFilter = 'all';
    let newsletterCounts = null; // {quotidien_total, quotidien_published, hebdo_total, hebdo_published}

    function newsletterEnabled() {
      return !!getUser()?.tenant_newsletter_enabled;
    }

    // ---- Init ----
    async function init() {
      document.getElementById('app').innerHTML = renderHeader() + `
        <div class="flex">
          <!-- Left sidebar: Filters -->
          <aside class="sidebar" id="sidebar-left"></aside>

          <!-- Center: Article list -->
          <main class="content-main" id="article-list">
            <div class="loading-overlay"><div class="spinner"></div> Chargement des articles...</div>
          </main>

          <!-- Right sidebar: Stats -->
          <aside class="sidebar sidebar-right" id="sidebar-right"></aside>
        </div>`;

      try {
        const [articlesData, sourcesData, countsData] = await Promise.all([
          api('/api/v1/articles'),
          api('/api/v1/sources/health').catch(() => []),
          newsletterEnabled() ? api('/api/v1/articles/newsletter/counts').catch(() => null) : Promise.resolve(null),
        ]);
        // Handle paginated response {items:[], total} or plain array
        articles = Array.isArray(articlesData) ? articlesData : (articlesData?.items || []);
        sources = Array.isArray(sourcesData) ? sourcesData : (sourcesData?.items || []);
        newsletterCounts = countsData;
      } catch (e) {
        document.getElementById('article-list').innerHTML =
          `<div class="empty-state"><div class="icon">!</div><p>${e.message}</p></div>`;
        return;
      }

      renderSidebar();
      renderArticles();
      renderRightPanel();
    }

    // ---- Left sidebar ----
    function renderSidebar() {
      const counts = { all: articles.length, nouveau: 0, quotidien: 0, hebdo: 0, ignorer: 0 };
      articles.forEach(a => { if (counts[a.status] !== undefined) counts[a.status]++; });

      // Score ranges
      const scoreCounts = { all: articles.length, high: 0, med: 0, low: 0 };
      articles.forEach(a => {
        if ((a.score || 0) >= 50) scoreCounts.high++;
        else if ((a.score || 0) >= 25) scoreCounts.med++;
        else scoreCounts.low++;
      });

      // Source counts
      const srcCounts = {};
      articles.forEach(a => {
        const s = a.source_name || 'Autre';
        srcCounts[s] = (srcCounts[s] || 0) + 1;
      });

      document.getElementById('sidebar-left').innerHTML = `
        <div class="sidebar-section">
          <h3>Statut</h3>
          <div class="filter-group">
            ${filterBtn('all', 'Tous', counts.all)}
            ${filterBtn('nouveau', 'Nouveaux', counts.nouveau)}
            ${filterBtn('quotidien', 'Quotidien', counts.quotidien)}
            ${filterBtn('hebdo', 'Hebdo', counts.hebdo)}
            ${filterBtn('ignorer', 'Ignorés', counts.ignorer)}
          </div>
        </div>

        <div class="sidebar-section">
          <h3>Score</h3>
          <div class="filter-group">
            ${scoreFilterBtn('all', 'Tous', scoreCounts.all)}
            ${scoreFilterBtn('high', 'Prioritaire (50+)', scoreCounts.high)}
            ${scoreFilterBtn('med', 'Moyen (25-49)', scoreCounts.med)}
            ${scoreFilterBtn('low', 'Faible (<25)', scoreCounts.low)}
          </div>
        </div>

        <div class="sidebar-section">
          <h3>Source</h3>
          <div class="filter-group" style="max-height:200px;overflow-y:auto">
            ${Object.entries(srcCounts).sort((a,b) => b[1]-a[1]).slice(0, 10).map(([name, count]) =>
              `<div class="filter-item text-sm"><span style="flex:1;overflow:hidden;text-overflow:ellipsis">${name}</span><span class="filter-count">${count}</span></div>`
            ).join('')}
          </div>
        </div>`;

      // Bind filter clicks
      document.querySelectorAll('[data-filter]').forEach(el => {
        el.addEventListener('click', () => {
          activeFilter = el.dataset.filter;
          renderSidebar();
          renderArticles();
        });
      });
      document.querySelectorAll('[data-score-filter]').forEach(el => {
        el.addEventListener('click', () => {
          scoreFilter = el.dataset.scoreFilter;
          renderSidebar();
          renderArticles();
        });
      });
    }

    function filterBtn(key, label, count) {
      const active = activeFilter === key ? 'active' : '';
      return `<button class="filter-item ${active}" data-filter="${key}">
        <span>${label}</span><span class="filter-count">${count}</span>
      </button>`;
    }
    function scoreFilterBtn(key, label, count) {
      const active = scoreFilter === key ? 'active' : '';
      return `<button class="filter-item ${active}" data-score-filter="${key}">
        <span>${label}</span><span class="filter-count">${count}</span>
      </button>`;
    }

    // ---- Article list ----
    function renderArticles() {
      let filtered = [...articles];

      if (activeFilter !== 'all') {
        filtered = filtered.filter(a => a.status === activeFilter);
      }
      if (scoreFilter === 'high') filtered = filtered.filter(a => (a.score||0) >= 50);
      else if (scoreFilter === 'med') filtered = filtered.filter(a => (a.score||0) >= 25 && (a.score||0) < 50);
      else if (scoreFilter === 'low') filtered = filtered.filter(a => (a.score||0) < 25);

      if (filtered.length === 0) {
        document.getElementById('article-list').innerHTML = `
          <div class="empty-state">
            <div class="icon">&#128196;</div>
            <p>Aucun article dans cette vue</p>
          </div>`;
        return;
      }

      document.getElementById('article-list').innerHTML = filtered.map(a => `
        <div class="article-card" onclick="window.location.href='article.html?id=${a.id}'">
          <div class="article-meta">
            <span>${a.source_name || 'Source inconnue'}</span>
            <span>&middot;</span>
            <span>${formatDate(a.published_at || a.created_at)}</span>
            ${a.detected_action_type ? actionBadge(a.detected_action_type) : ''}
            <span style="margin-left:auto">${statusBadge(a.status)}</span>
          </div>
          <div class="article-title">${escHtml(a.title || 'Sans titre')}</div>
          ${scoreBar(a.score)}
          <div class="article-actions">
            <button class="btn btn-sm btn-triage${a.status === 'quotidien' ? ' btn-triage-active' : ''}" onclick="event.stopPropagation();triage('${a.id}','quotidien')">Quotidien</button>
            <button class="btn btn-sm btn-triage${a.status === 'hebdo' ? ' btn-triage-active' : ''}" onclick="event.stopPropagation();triage('${a.id}','hebdo')">Hebdo</button>
            <button class="btn btn-sm btn-triage${a.status === 'ignorer' ? ' btn-triage-active' : ''}" onclick="event.stopPropagation();triage('${a.id}','ignorer')">Ignorer</button>
            ${newsletterEnabled() && (a.status === 'quotidien' || a.status === 'hebdo') ? `
              <button class="btn btn-sm ${a.published_to_newsletter ? 'btn-primary' : 'btn-secondary'}"
                      onclick="event.stopPropagation();publishArticle('${a.id}')"
                      ${a.published_to_newsletter ? 'disabled title="Publié le ' + formatDate(a.published_to_newsletter_at) + '"' : ''}>
                ${a.published_to_newsletter ? '✓ Publié' : 'Publier'}
              </button>` : ''}
          </div>
        </div>
      `).join('');
    }

    async function publishArticle(id) {
      try {
        const res = await api(`/api/v1/articles/${id}/published`, { method: 'POST', body: {} });
        const idx = articles.findIndex(a => a.id === id);
        if (idx !== -1) {
          articles[idx].published_to_newsletter = true;
          articles[idx].published_to_newsletter_at = res.published_to_newsletter_at;
        }
        // Refresh counts
        if (newsletterEnabled()) {
          newsletterCounts = await api('/api/v1/articles/newsletter/counts').catch(() => newsletterCounts);
        }
        renderArticles();
        renderRightPanel();
        toast('Article publié dans la newsletter');
      } catch (e) {
        toast(e.message, 'error');
      }
    }

    async function triage(id, status) {
      try {
        await api(`/api/v1/articles/${id}/triage`, { method: 'PATCH', body: { status } });
        const idx = articles.findIndex(a => a.id === id);
        if (idx !== -1) articles[idx].status = status;
        renderSidebar();
        renderArticles();
        toast(`Article → ${status === 'quotidien' ? 'Quotidien' : status === 'hebdo' ? 'Hebdo' : 'Ignoré'}`);
      } catch (e) {
        toast(e.message, 'error');
      }
    }

    // ---- Right panel ----
    function renderRightPanel() {
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const weekAgo = new Date(today - 7 * 86400000);

      const daily = articles.filter(a => new Date(a.created_at) >= today).length;
      const weekly = articles.filter(a => new Date(a.created_at) >= weekAgo).length;

      // Sources health
      const srcList = Array.isArray(sources) ? sources : [];

      const nc = newsletterCounts;
      const newsletterBlock = (newsletterEnabled() && nc) ? `
        <div class="sidebar-section">
          <h3>Newsletter</h3>
          <div class="stat-card">
            <div class="stat-value">${nc.quotidien_published} / ${nc.quotidien_total}</div>
            <div class="stat-label">Quotidien publié</div>
          </div>
          <div class="stat-card" style="margin-top:8px">
            <div class="stat-value">${nc.hebdo_published} / ${nc.hebdo_total}</div>
            <div class="stat-label">Hebdo publié</div>
          </div>
          <div class="flex flex-col gap-4" style="margin-top:12px">
            <button class="btn btn-secondary btn-sm" onclick="exportArticles('markdown','quotidien')">Export Markdown — Quotidien</button>
            <button class="btn btn-secondary btn-sm" onclick="exportArticles('markdown','hebdo')">Export Markdown — Hebdo</button>
          </div>
        </div>` : '';

      document.getElementById('sidebar-right').innerHTML = `
        ${newsletterBlock}
        <div class="sidebar-section">
          <h3>Quotidien</h3>
          <div class="stat-card">
            <div class="stat-value">${daily}</div>
            <div class="stat-label">articles aujourd'hui</div>
          </div>
        </div>

        <div class="sidebar-section">
          <h3>Hebdomadaire</h3>
          <div class="stat-card">
            <div class="stat-value">${weekly}</div>
            <div class="stat-label">articles cette semaine</div>
          </div>
        </div>

        <div class="sidebar-section">
          <h3>Export</h3>
          <div class="flex flex-col gap-4">
            <button class="btn btn-secondary btn-sm" onclick="exportArticles('json')">Export JSON</button>
            <button class="btn btn-secondary btn-sm" onclick="exportArticles('markdown')">Export Markdown</button>
          </div>
        </div>

        <div class="sidebar-section">
          <h3>Sources</h3>
          <div id="sources-health">
            ${srcList.length ? srcList.slice(0, 12).map(s => `
              <div class="source-row">
                <span class="flex items-center">
                  <span class="source-dot ${s.status === 'OK' || s.status === 'ok' ? 'ok' : s.status === 'warning' ? 'warn' : 'err'}"></span>
                  <span style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${s.name || s.slug}</span>
                </span>
                <span class="text-xs text-tertiary">${s.article_count || 0}</span>
              </div>`).join('') : '<p class="text-sm text-tertiary">Aucune source</p>'}
          </div>
        </div>`;
    }

    async function exportArticles(format, type) {
      try {
        let path = format === 'markdown' ? '/api/v1/articles/export/markdown' : '/api/v1/articles/export';
        if (type) path += `?type=${type}`;
        const data = await api(path);
        const blob = new Blob([typeof data === 'string' ? data : JSON.stringify(data, null, 2)], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        const suffix = type ? `-${type}` : '';
        a.download = `earlywatch-export${suffix}.${format === 'markdown' ? 'md' : 'json'}`;
        a.click();
        URL.revokeObjectURL(url);
        toast('Export téléchargé');
      } catch (e) {
        toast(e.message, 'error');
      }
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    init();
  </script>
</body>
</html>
