<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Early Watch — Nouveau mot de passe</title>
<link rel="stylesheet" href="style.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
  body::before { display: none; }
  .card { width: 100%; max-width: 340px; }
  .brand { font-size: 16px; font-weight: 500; margin-bottom: 12px; text-align: center; }
  .brand span { color: var(--kaki); }
  .subtitle { font-size: 13px; color: var(--color-text-secondary); text-align: center; margin-bottom: 32px; line-height: 1.6; }
  label { font-size: 13px; font-weight: 400; color: var(--color-text-secondary); margin-bottom: 6px; }
  input {
    width: 100%; padding: 11px 0;
    border: none; border-bottom: 1px solid var(--color-border-primary);
    background: transparent; font-size: 15px; font-family: inherit;
    color: var(--noir); outline: none; margin-bottom: 24px;
    transition: border-color .15s; border-radius: 0;
  }
  input:focus { border-color: var(--kaki); }
  input.error { border-color: var(--color-danger); margin-bottom: 6px; }
  button {
    width: 100%; padding: 13px; background: var(--kaki); color: #fff;
    border: none; border-radius: 6px; font-size: 14px; font-weight: 500;
    font-family: inherit; cursor: pointer; transition: opacity .15s; margin-top: 8px;
  }
  button:hover { opacity: .85; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .msg { font-size: 13px; text-align: center; margin-top: 16px; line-height: 1.6; display: none; }
  .msg.success { display: block; color: var(--kaki); }
  .msg.error { display: block; color: var(--color-danger); }
  .footer { margin-top: 24px; text-align: center; font-size: 12px; color: var(--color-text-secondary); }
  .footer a { color: var(--kaki); text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">Early<span>Watch</span></div>
  <p class="subtitle">Choisissez un nouveau mot de passe.</p>
  <form id="reset-form" onsubmit="resetPassword(event)">
    <label for="password">Nouveau mot de passe</label>
    <input type="password" id="password" autocomplete="new-password" required minlength="8">
    <label for="confirm">Confirmer</label>
    <input type="password" id="confirm" autocomplete="new-password" required minlength="8">
    <div class="msg error" id="match-err" style="display:none">Les mots de passe ne correspondent pas.</div>
    <button type="submit" id="btn">Changer le mot de passe</button>
  </form>
  <div class="msg" id="msg"></div>
  <div class="footer"><a href="login.html">&larr; Retour &#224; la connexion</a></div>
</div>

<script>
const API = (() => {
  const h = window.location.hostname;
  if (h === 'localhost' || h === '127.0.0.1' || h === '') return 'http://127.0.0.1:8000';
  return 'https://earlybriefp7hwqsga-earlybrief-api.functions.fnc.fr-par.scw.cloud';
})();

const params = new URLSearchParams(window.location.search);
const token = params.get('token');

if (!token) {
  document.getElementById('reset-form').style.display = 'none';
  const msg = document.getElementById('msg');
  msg.textContent = 'Lien invalide ou expir\u00e9. Demandez un nouveau lien.';
  msg.className = 'msg error';
}

async function resetPassword(e) {
  e.preventDefault();
  const pwd = document.getElementById('password');
  const confirm = document.getElementById('confirm');
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');
  const matchErr = document.getElementById('match-err');

  matchErr.style.display = 'none';
  msg.className = 'msg';

  if (pwd.value !== confirm.value) {
    matchErr.style.display = 'block';
    confirm.classList.add('error');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Mise \u00e0 jour\u2026';

  try {
    const r = await fetch(`${API}/api/v1/auth/reset-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, new_password: pwd.value }),
    });

    if (r.ok) {
      msg.textContent = 'Mot de passe mis \u00e0 jour. Redirection\u2026';
      msg.className = 'msg success';
      document.getElementById('reset-form').style.display = 'none';
      setTimeout(() => { window.location.href = 'login.html'; }, 2000);
    } else {
      const d = await r.json().catch(() => ({}));
      throw new Error(d.detail || 'Lien expir\u00e9 ou invalide');
    }
  } catch (ex) {
    msg.textContent = ex.message;
    msg.className = 'msg error';
    btn.disabled = false;
    btn.textContent = 'Changer le mot de passe';
  }
}
</script>
</body>
</html>
